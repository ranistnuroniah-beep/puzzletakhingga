<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Puzzle Deret Geometri</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--tx:#1b1f2a;--mut:#6a7186;--bd:#cfd5e6;--ac:#2f6bff;--ok:#2b9a5b;--okbg:#e3f6ec;--no:#d6336c;--nobg:#fde6ee;--dv:#e8590c;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12151c;--card:#1b2030;--tx:#e8ebf4;--mut:#9aa3ba;--bd:#38405a;--ac:#6c9bff;--ok:#58d08e;--okbg:#17332437;--no:#ff7aa5;--nobg:#3a1a27;--dv:#ff9150}}
:root[data-theme="dark"]{--bg:#12151c;--card:#1b2030;--tx:#e8ebf4;--mut:#9aa3ba;--bd:#38405a;--ac:#6c9bff;--ok:#58d08e;--okbg:#173324;--no:#ff7aa5;--nobg:#3a1a27;--dv:#ff9150}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.4;-webkit-user-select:none;user-select:none}
.wrap{max-width:820px;margin:0 auto;padding:14px}
h1{font-size:1.25rem;margin:2px 0}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.pill{font-size:.82rem;padding:3px 10px;border-radius:99px;background:var(--card);border:1px solid var(--bd)}
.hint{color:var(--mut);font-size:.9rem;margin:6px 0 12px}
.pool{display:flex;flex-wrap:wrap;gap:8px;min-height:56px;padding:10px;border:1px dashed var(--bd);border-radius:12px;margin-bottom:12px}
.card{touch-action:none;cursor:grab;background:var(--card);border:2px solid var(--bd);border-radius:10px;padding:8px 12px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.95rem;box-shadow:0 1px 3px #0002}
.card.sel{border-color:var(--ac);box-shadow:0 0 0 3px #2f6bff44}
.card.lock{cursor:default;border-color:var(--ok);background:var(--okbg);box-shadow:none}
.card.drag{opacity:.35}
.ghost{position:fixed;z-index:99;pointer-events:none;transform:translate(-50%,-50%) scale(1.06);box-shadow:0 8px 20px #0004}
.boxes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.box{min-height:170px;border:2px dashed var(--bd);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:8px;background:var(--card)}
.box h2{margin:0;font-size:1rem}
.box.conv h2{color:var(--ok)}.box.div h2{color:var(--dv)}
.over{border-color:var(--ac)!important;background:#2f6bff14!important}
.rows{display:flex;flex-direction:column;gap:8px}
.row{display:grid;grid-template-columns:1fr 110px;gap:10px;align-items:center;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:8px 10px}
.row .ser{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.92rem;overflow-wrap:anywhere}
.row .ser small{display:block;color:var(--mut);font-family:system-ui;font-size:.75rem}
.slot{min-height:44px;border:2px dashed var(--bd);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:.8rem;color:var(--mut)}
.slot .card{padding:6px 10px}
.shake{animation:sh .35s;border-color:var(--no)!important;background:var(--nobg)!important}
@keyframes sh{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.btn{background:var(--ac);color:#fff;border:0;border-radius:10px;padding:9px 16px;font-size:.95rem;cursor:pointer}
.btn.ghostb{background:transparent;color:var(--ac);border:1px solid var(--ac);padding:4px 10px;font-size:.8rem}
.end{text-align:center;padding:26px 14px;background:var(--card);border:1px solid var(--bd);border-radius:14px}
.end .big{font-size:2.2rem}
.msg{min-height:1.3em;font-size:.88rem;margin:0 0 8px}
@media (max-width:480px){.row{grid-template-columns:1fr 96px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><h1>Puzzle Deret Geometri</h1><div><span class="pill" id="stg"></span> <span class="pill" id="err"></span></div></div>
  <p class="hint" id="hint"></p>
  <p class="msg" id="msg"></p>
  <div id="app"></div>
</div>
<script>
const SER=[
 {id:1,t:"4 + 2 + 1 + 1/2 + …",r:"1/2",c:1,v:"8"},
 {id:2,t:"9 + 3 + 1 + 1/3 + …",r:"1/3",c:1,v:"27/2"},
 {id:3,t:"10 − 5 + 5/2 − 5/4 + …",r:"−1/2",c:1,v:"20/3"},
 {id:4,t:"12 + 8 + 16/3 + 32/9 + …",r:"2/3",c:1,v:"36"},
 {id:5,t:"5 + 1 + 1/5 + 1/25 + …",r:"1/5",c:1,v:"25/4"},
 {id:6,t:"2 + 4 + 8 + 16 + …",r:"2",c:0},
 {id:7,t:"3 − 3 + 3 − 3 + …",r:"−1",c:0},
 {id:8,t:"5 + 5 + 5 + 5 + …",r:"1",c:0},
 {id:9,t:"1 − 3 + 9 − 27 + …",r:"−3",c:0}
];
const $=id=>document.getElementById(id);
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
let stage=1,errs=0,sel=null,done1=0,done2=0;

function setMsg(t,ok){const m=$('msg');m.textContent=t;m.style.color=ok?'var(--ok)':'var(--no)'}
function head(){
  $('stg').textContent='Tahap '+stage+' / 2';
  $('err').textContent='Salah: '+errs;
}
function mk(txt,data){
  const d=document.createElement('div');d.className='card';d.textContent=txt;
  Object.assign(d.dataset,data);return d;
}

/* ---------- Tahap 1 ---------- */
function start1(){
  stage=1;done1=0;errs=errs;head();sel=null;
  $('hint').textContent='Tarik (atau ketuk lalu ketuk kotak) setiap kartu deret ke kotak “Konvergen” atau “Divergen”.';
  setMsg('');
  $('app').innerHTML=`<div class="pool" id="pool"></div>
   <div class="boxes">
    <div class="box conv" data-zone="1"><h2>✔ Konvergen</h2></div>
    <div class="box div" data-zone="0"><h2>✖ Divergen</h2></div>
   </div>`;
  shuf(SER).forEach(s=>$('pool').appendChild(mk(s.t,{sid:s.id,c:s.c,kind:'a'})));
  wire();
}

/* ---------- Tahap 2 ---------- */
function start2(){
  stage=2;done2=0;head();sel=null;
  $('hint').innerHTML='Cocokkan setiap kartu nilai S∞ dengan deret konvergen yang tepat. <button class="btn ghostb" id="hb">Tampilkan rasio</button>';
  setMsg('');
  const cv=SER.filter(s=>s.c);
  $('app').innerHTML=`<div class="pool" id="pool"></div><div class="rows" id="rows"></div>`;
  shuf(cv).forEach(s=>$('pool').appendChild(mk(s.v,{sid:s.id,kind:'b'})));
  cv.forEach(s=>{
    const r=document.createElement('div');r.className='row';
    r.innerHTML=`<div class="ser">${s.t}<small class="rr" style="display:none">r = ${s.r}</small></div><div class="slot" data-zone="${s.id}">S∞ = ?</div>`;
    $('rows').appendChild(r);
  });
  $('hb').onclick=()=>{document.querySelectorAll('.rr').forEach(e=>e.style.display='block');$('hb').remove()};
  wire();
}

function attempt(card,zone){
  const ok = stage===1 ? card.dataset.c===zone.dataset.zone : card.dataset.sid===zone.dataset.zone;
  if(ok){
    card.classList.add('lock');card.classList.remove('sel');
    if(stage===1){
      zone.appendChild(card);
      const s=SER.find(x=>x.id==card.dataset.sid);
      setMsg(`Benar! r = ${s.r} → ${s.c?'|r| < 1, konvergen.':'|r| ≥ 1, divergen.'}`,true);
      if(++done1===SER.length)setTimeout(start2,900);
    }else{
      zone.textContent='';zone.style.border='2px solid var(--ok)';zone.appendChild(card);
      setMsg('Cocok! S∞ = a/(1 − r).',true);
      if(++done2===SER.filter(s=>s.c).length)setTimeout(finish,800);
    }
    sel=null;
  }else{
    errs++;head();
    (stage===1?zone:zone).classList.add('shake');
    card.classList.add('shake');
    setTimeout(()=>{zone.classList.remove('shake');card.classList.remove('shake')},400);
    setMsg(stage===1?'Belum tepat. Periksa rasio r: konvergen jika |r| < 1.':'Belum cocok. Hitung S∞ = a/(1 − r) untuk deret itu.',false);
  }
}

function finish(){
  const stars=errs===0?3:errs<=3?2:1;
  $('hint').textContent='';setMsg('');
  $('app').innerHTML=`<div class="end"><div class="big">${'⭐'.repeat(stars)}</div>
   <h2>Selesai!</h2><p>Kesalahan: <b>${errs}</b>. ${errs===0?'Sempurna!':'Coba lagi untuk skor lebih baik.'}</p>
   <button class="btn" id="re">Main lagi</button></div>`;
  $('re').onclick=()=>{errs=0;start1()};
}

/* ---------- Drag & ketuk ---------- */
function zoneAt(x,y){
  const e=document.elementFromPoint(x,y);
  const z=e&&e.closest('[data-zone]');
  return z&&!z.querySelector('.card.lock')||z&&stage===1?z:null;
}
function wire(){
  document.querySelectorAll('[data-zone]').forEach(z=>z.addEventListener('click',()=>{
    if(sel&&!(stage===2&&z.querySelector('.card')))attempt(sel,z);
  }));
  document.querySelectorAll('.card').forEach(c=>c.addEventListener('pointerdown',down));
}
function down(e){
  const c=e.currentTarget;if(c.classList.contains('lock'))return;
  e.preventDefault();
  const sx=e.clientX,sy=e.clientY;let g=null,moved=false;
  const mv=ev=>{
    if(!moved&&Math.hypot(ev.clientX-sx,ev.clientY-sy)>6){
      moved=true;g=c.cloneNode(true);g.classList.add('ghost');document.body.appendChild(g);c.classList.add('drag');
    }
    if(g){
      g.style.left=ev.clientX+'px';g.style.top=ev.clientY+'px';
      document.querySelectorAll('.over').forEach(o=>o.classList.remove('over'));
      const z=zoneAt(ev.clientX,ev.clientY);if(z)z.classList.add('over');
    }
  };
  const up=ev=>{
    document.removeEventListener('pointermove',mv);document.removeEventListener('pointerup',up);document.removeEventListener('pointercancel',up);
    document.querySelectorAll('.over').forEach(o=>o.classList.remove('over'));
    if(g){g.remove();c.classList.remove('drag');const z=zoneAt(ev.clientX,ev.clientY);if(z)attempt(c,z);}
    else{
      const was=c.classList.contains('sel');
      document.querySelectorAll('.card.sel').forEach(x=>x.classList.remove('sel'));
      if(was)sel=null;else{c.classList.add('sel');sel=c}
    }
  };
  document.addEventListener('pointermove',mv);document.addEventListener('pointerup',up);document.addEventListener('pointercancel',up);
}
start1();
</script>
</body>
</html>
